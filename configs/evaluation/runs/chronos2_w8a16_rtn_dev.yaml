# Chronos-2 W8A16 RTN (per-channel symmetric int8 weights) — first quantized variant.
# Dev subset for sanity; promote to _full once retention looks sane.
name: chronos2_w8a16_rtn_dev
benchmark: configs/evaluation/benchmarks/chronos_zeroshot.yaml
task_names:
  - monash_cif_2016
  - monash_m1_quarterly
  - monash_tourism_quarterly
  - monash_covid_deaths
  - exchange_rate
  - ercot
  - monash_hospital
  - monash_nn5_weekly
predictor:
  type: chronos2
  model_id: amazon/chronos-2
  name: chronos2-w8a16-rtn
  device_map: cuda
  batch_size: 128
  quantization:
    method: rtn
    bits: 8
    granularity: per_channel
