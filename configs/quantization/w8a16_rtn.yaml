# Weight-only INT8 round-to-nearest — the simplest PTQ variant; first quantization target.
name: w8a16_rtn
model_id: amazon/chronos-2
method: rtn            # round-to-nearest, weight-only
weights:
  bits: 8
  granularity: per_channel
  symmetric: true
activations:
  bits: 16             # activations kept in bf16
device: cuda
# Modules kept in high precision (to be refined by sensitivity analysis, RQ3)
skip_modules: []
