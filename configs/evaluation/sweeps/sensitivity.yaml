# RQ3 module-family sensitivity sweep (dual-metric leave-one-out at W4).
#
# All arms use the reference RTN in simulate mode (bits=4, per-channel, fp32 container):
# W4-rtn-sim has good dynamic range (full-tier WQL retention 1.66) so protecting or
# isolating a family produces measurable movement in both accuracy AND calibration.
#
# Families partition the full quantized set (all 126 Linears, incl. input patch
# embedding and the output/quantile head — quantized by default in every prior run):
#   patch_embed (3) | time_attn (48, layer.0) | group_attn (48, layer.1)
#   | ffn (24, layer.2 mlp) | head (3, output_patch_embedding)
# plus positional groups first_block / last_block (10 each, protect-direction only).
#
# Directions: PROTECT-ONE (quantize all except family F) and ONLY-ONE (quantize only F).
# Variants are generated by chronosquant.quantization.sensitivity.build_sensitivity_variants;
# tests/test_sensitivity.py asserts this file matches the builder exactly.
#
# Run:  uv run python scripts/sweep.py configs/evaluation/sweeps/sensitivity.yaml --tier dev
# Then: uv run python -m chronosquant.quantization.sensitivity report --tier dev
name: sensitivity
benchmark: configs/evaluation/benchmarks/chronos_zeroshot.yaml
reference_model: chronos2-fp32
dev_task_names:
  - monash_cif_2016
  - monash_m1_quarterly
  - monash_tourism_quarterly
  - monash_covid_deaths
  - exchange_rate
  - ercot
  - monash_hospital
  - monash_nn5_weekly
base_predictor:
  type: chronos2
  model_id: amazon/chronos-2
  device_map: cuda
  batch_size: 128
variants:
  - name: chronos2-sens-w4-all
    quantization:
      method: rtn
      bits: 4
      simulate: true
  - name: chronos2-sens-w4-protect-patch-embed
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - input_patch_embedding.*
  - name: chronos2-sens-w4-protect-time-attn
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - encoder.block.*.layer.0.self_attention.*
  - name: chronos2-sens-w4-protect-group-attn
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - encoder.block.*.layer.1.self_attention.*
  - name: chronos2-sens-w4-protect-ffn
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - encoder.block.*.layer.2.mlp.*
  - name: chronos2-sens-w4-protect-head
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - output_patch_embedding.*
  - name: chronos2-sens-w4-only-patch-embed
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - encoder.block.*.layer.0.self_attention.*
        - encoder.block.*.layer.1.self_attention.*
        - encoder.block.*.layer.2.mlp.*
        - output_patch_embedding.*
  - name: chronos2-sens-w4-only-time-attn
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - input_patch_embedding.*
        - encoder.block.*.layer.1.self_attention.*
        - encoder.block.*.layer.2.mlp.*
        - output_patch_embedding.*
  - name: chronos2-sens-w4-only-group-attn
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - input_patch_embedding.*
        - encoder.block.*.layer.0.self_attention.*
        - encoder.block.*.layer.2.mlp.*
        - output_patch_embedding.*
  - name: chronos2-sens-w4-only-ffn
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - input_patch_embedding.*
        - encoder.block.*.layer.0.self_attention.*
        - encoder.block.*.layer.1.self_attention.*
        - output_patch_embedding.*
  - name: chronos2-sens-w4-only-head
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - input_patch_embedding.*
        - encoder.block.*.layer.0.self_attention.*
        - encoder.block.*.layer.1.self_attention.*
        - encoder.block.*.layer.2.mlp.*
  - name: chronos2-sens-w4-protect-first-block
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - encoder.block.0.layer.*
  - name: chronos2-sens-w4-protect-last-block
    quantization:
      method: rtn
      bits: 4
      simulate: true
      skip_modules:
        - encoder.block.11.layer.*
