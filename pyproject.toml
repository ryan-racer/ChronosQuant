[project]
name = "chronosquant"
version = "0.1.0"
description = "Quantizing the Chronos-2 time series foundation model: methods, evaluation framework, and accuracy/efficiency benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Quinlivan", email = "mr.ryanquinlivan@gmail.com" }]
keywords = [
    "time-series",
    "forecasting",
    "foundation-models",
    "quantization",
    "chronos",
    "model-compression",
]
dependencies = [
    "chronos-forecasting>=2.0",
    "torch>=2.6",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "truststore>=0.10.4",
    "fev>=0.9.0",
    "scipy>=1.17.1",
    "psutil>=7.2.2",
    "datasets>=3.6,<4.0",
    "torchao>=0.17.0",
    "hqq>=0.2.8.post1",
    "bitsandbytes>=0.49.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "ipykernel", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronosquant"]

# --- uv: use OS certificate store (required behind corporate TLS interception) ---
[tool.uv]
system-certs = true

# --- uv: pull CUDA-enabled torch on Windows (RTX 2000 Ada, driver 596.58) ---
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: requires internet access (HF dataset downloads); run with `pytest -m network`",
]

[dependency-groups]
dev = [
    "markdown>=3.10.2",
    "pymupdf>=1.28.0",
]
